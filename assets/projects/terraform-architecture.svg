<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Terraform AWS Webapp architecture</title><desc id="desc">Public Application Load Balancer forwards requests to EC2 instances in an Auto Scaling Group in private subnets, with RDS MySQL. CloudWatch provides monitoring and S3 stores assets.</desc><rect width="960" height="560" rx="16" fill="#0b1120"/><g font-family="Arial,sans-serif"><text x="38" y="46" font-size="24" fill="#e7edf7">Terraform AWS Webapp</text><text x="38" y="74" font-size="14" fill="#a0adc3">Simplified architecture from the public Terraform source</text><rect x="38" y="102" width="884" height="418" rx="12" fill="#101a2c" stroke="#35506c" stroke-dasharray="6 5"/><text x="60" y="129" fill="#7dd3fc" font-size="15">AWS VPC</text><rect x="90" y="151" width="550" height="89" rx="8" fill="#122e41" stroke="#4e7a96"/><text x="113" y="178" fill="#a0adc3" font-size="13">PUBLIC SUBNETS</text><text x="113" y="211" fill="#e7edf7" font-size="21">Application Load Balancer</text><path d="M365 240v35" stroke="#7dd3fc" stroke-width="2"/><rect x="90" y="275" width="550" height="122" rx="8" fill="#12312d" stroke="#4b8071"/><text x="113" y="302" fill="#a5e4c4" font-size="13">PRIVATE SUBNETS / AUTO SCALING GROUP</text><rect x="116" y="320" width="224" height="52" rx="6" fill="#1a423b"/><rect x="361" y="320" width="252" height="52" rx="6" fill="#1a423b"/><text x="173" y="352" fill="#e7edf7" font-size="20">EC2 instance</text><text x="433" y="352" fill="#e7edf7" font-size="20">EC2 instance</text><path d="M365 397v30" stroke="#7dd3fc" stroke-width="2"/><rect x="235" y="427" width="260" height="66" rx="8" fill="#252a49" stroke="#7c73aa"/><text x="295" y="467" fill="#e7edf7" font-size="21">RDS MySQL</text><rect x="689" y="168" width="190" height="91" rx="8" fill="#17263b" stroke="#42617e"/><text x="714" y="206" fill="#e7edf7" font-size="20">CloudWatch</text><text x="714" y="232" fill="#a0adc3" font-size="14">Metrics and alarms</text><rect x="689" y="294" width="190" height="91" rx="8" fill="#17263b" stroke="#42617e"/><text x="714" y="333" fill="#e7edf7" font-size="20">S3</text><text x="714" y="359" fill="#a0adc3" font-size="14">Application assets</text></g></svg>