<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">EKS Autoscaling Lab</title><desc id="desc">KEDA reads SQS demand to adjust worker replicas. Pending workers cause Karpenter to provision nodes. Application replicas and node capacity are separate scaling loops.</desc><rect width="1000" height="530" rx="14" fill="#0b1120"/><g font-family="Arial,sans-serif"><text x="35" y="47" fill="#e7edf7" font-size="25">EKS Autoscaling Lab</text><text x="35" y="78" fill="#a0adc3" font-size="15">Application replicas and node capacity: two scaling loops</text><rect x="45" y="210" width="210" height="95" rx="10" fill="#263049" stroke="#5b7a9b"/><text x="80" y="249" fill="#e7edf7" font-size="22">Amazon SQS</text><text x="80" y="277" fill="#a0adc3" font-size="14">Synthetic messages</text><rect x="355" y="130" width="260" height="95" rx="10" fill="#163b38" stroke="#65a999"/><text x="380" y="170" fill="#a5e4c4" font-size="22">KEDA / ScaledObject</text><text x="380" y="199" fill="#c3d6ce" font-size="14">Queue demand to replicas</text><rect x="355" y="330" width="260" height="95" rx="10" fill="#14334b" stroke="#568bab"/><text x="380" y="369" fill="#7dd3fc" font-size="22">Worker pods</text><text x="380" y="398" fill="#adc2d6" font-size="14">Process and acknowledge</text><rect x="715" y="130" width="240" height="95" rx="10" fill="#2a2744" stroke="#8b81b3"/><text x="742" y="170" fill="#d0c3ff" font-size="22">Karpenter</text><text x="742" y="199" fill="#bfb5d2" font-size="14">Pending pods to capacity</text><rect x="715" y="330" width="240" height="95" rx="10" fill="#1c2a3c" stroke="#607f9c"/><text x="742" y="369" fill="#e7edf7" font-size="22">EC2 nodes / EKS</text><text x="742" y="398" fill="#adc2d6" font-size="14">Dedicated lab NodePool</text><path d="M255 235h45V177h55M485 225v105M255 280h45v97h55M615 350h50V177h50M835 225v105" fill="none" stroke="#668ca9" stroke-width="2"/><text x="40" y="491" fill="#a0adc3" font-size="14">Reference design · generic manifests · offline-tested worker and resource contracts</text></g></svg>
