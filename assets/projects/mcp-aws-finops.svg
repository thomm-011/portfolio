<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">mcp-aws-finops</title><desc id="desc">Um agente de IA conversa por MCP com o servidor FastMCP, que expõe sete ferramentas de FinOps sobre dados FOCUS em DuckDB. Um backend de AWS Cost Explorer está no roadmap, ainda não implementado.</desc><rect width="1000" height="530" rx="14" fill="#0b1120"/><g font-family="Arial,sans-serif"><text x="35" y="47" fill="#e7edf7" font-size="25">mcp-aws-finops</text><text x="35" y="78" fill="#a0adc3" font-size="15">Perguntas de custo AWS em linguagem natural, via MCP</text><rect x="40" y="200" width="220" height="95" rx="10" fill="#1c2a3c" stroke="#607f9c"/><text x="60" y="239" fill="#e7edf7" font-size="21">Agente de IA</text><text x="60" y="267" fill="#adc2d6" font-size="13">Claude · Cursor · Hermes</text><rect x="345" y="200" width="250" height="95" rx="10" fill="#163b38" stroke="#65a999"/><text x="365" y="234" fill="#a5e4c4" font-size="20">Servidor FastMCP</text><text x="365" y="260" fill="#c3d6ce" font-size="13">7 ferramentas · stdio</text><text x="365" y="282" fill="#c3d6ce" font-size="13">recurso semanal · prompt</text><rect x="680" y="100" width="280" height="95" rx="10" fill="#14334b" stroke="#568bab"/><text x="700" y="134" fill="#7dd3fc" font-size="19">FocusFileSource</text><text x="700" y="160" fill="#adc2d6" font-size="13">DuckDB sobre FOCUS</text><text x="700" y="182" fill="#adc2d6" font-size="13">(CSV/Parquet)</text><rect x="680" y="300" width="280" height="90" rx="10" stroke-dasharray="6 5" fill="#241c2c" stroke="#8b81b3"/><text x="700" y="332" fill="#d0c3ff" font-size="18">CostExplorerSource</text><text x="700" y="357" fill="#bfb5d2" font-size="13">boto3 · M4, não implementado</text><rect x="760" y="20" width="200" height="60" rx="8" fill="#263049" stroke="#5b7a9b"/><text x="780" y="46" fill="#e7edf7" font-size="14">sample_focus.parquet</text><text x="780" y="66" fill="#a0adc3" font-size="12">dados sintéticos, ~3 meses</text><path d="M260 240h85M595 240h85v-90h0M820 195v105M820 390v-200M820 80v20" fill="none" stroke="#668ca9" stroke-width="2"/><path d="M700 340h-105v-100" fill="none" stroke="#8b81b3" stroke-width="2" stroke-dasharray="6 5"/><text x="40" y="440" fill="#a0adc3" font-size="14">7 ferramentas: resumo de custos, comparação de períodos, principais</text><text x="40" y="463" fill="#a0adc3" font-size="14">direcionadores, custo por tag, recursos ociosos, previsão, anomalias</text><text x="40" y="491" fill="#a0adc3" font-size="14">Demonstração offline com dados sintéticos FOCUS · 40 testes · 96% cobertura</text></g></svg>